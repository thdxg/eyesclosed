# eyesclosed: a minimal low-chroma theme

"variable" = { fg = "variable" }
"variable.parameter" = { fg = "parameter" }
"variable.other.member" = { fg = "property" }
"variable.builtin" = { fg = "selfvar", modifiers = ["italic"] }
"keyword" = { fg = "keyword", modifiers = ["bold"] }
"function" = { fg = "function" }
"function.macro" = { fg = "macro", modifiers = ["italic"] }
"type" = { fg = "type" }
"type.builtin" = { fg = "builtin" }
"constructor" = { fg = "type" }
"constant" = { fg = "constant" }
"constant.numeric" = { fg = "constant" }
"constant.builtin" = { fg = "constant" }
"constant.character.escape" = { fg = "escape", modifiers = ["bold"] }
"string" = { fg = "string" }
"comment" = { fg = "comment", modifiers = ["italic"] }
"comment.block.documentation" = { fg = "doc", modifiers = ["italic"] }
"comment.line.documentation" = { fg = "doc", modifiers = ["italic"] }
"attribute" = { fg = "attribute" }
"label" = { fg = "lifetime", modifiers = ["italic"] }
"namespace" = { fg = "namespace" }
"operator" = { fg = "operator" }
"punctuation" = { fg = "punct" }
"markup.heading" = { fg = "md-heading", modifiers = ["bold"] }
"markup.heading.marker" = { fg = "md-hmark" }
"markup.bold" = { fg = "md-bold", modifiers = ["bold"] }
"markup.italic" = { fg = "md-italic", modifiers = ["italic"] }
"markup.raw" = { fg = "md-code" }
"markup.link.text" = { fg = "md-link", modifiers = ["underlined"] }
"markup.link.url" = { fg = "md-url" }
"markup.list" = { fg = "md-list" }
"markup.quote" = { fg = "md-quote", modifiers = ["italic"] }

"ui.background" = { bg = "bg" }
"ui.text" = { fg = "text" }
"ui.text.focus" = { fg = "function", bg = "focus-bg", modifiers = ["bold"] }
"ui.highlight" = { bg = "focus-bg" }
"special" = { fg = "constant", modifiers = ["bold"] }
"ui.cursor" = { fg = "bg", bg = "linenr-active" }
"ui.cursor.primary" = { fg = "bg", bg = "cursor" }
"ui.cursor.match" = { fg = "function", modifiers = ["underlined"] }
"ui.cursorline.primary" = { bg = "cursorline" }
"ui.selection" = { bg = "selection" }
"ui.linenr" = { fg = "linenr" }
"ui.linenr.selected" = { fg = "linenr-active" }
"ui.statusline" = { fg = "status-fg", bg = "bg-alt" }
"ui.statusline.inactive" = { fg = "linenr", bg = "bg-alt" }
"ui.statusline.normal" = { fg = "bg", bg = "mode", modifiers = ["bold"] }
"ui.statusline.insert" = { fg = "bg", bg = "warning", modifiers = ["bold"] }
"ui.statusline.select" = { fg = "bg", bg = "function", modifiers = ["bold"] }
"ui.popup" = { fg = "text", bg = "bg-alt" }
"ui.help" = { fg = "text", bg = "bg-alt" }
"ui.menu" = { fg = "text", bg = "bg-alt" }
"ui.menu.selected" = { fg = "function", bg = "focus-bg", modifiers = ["bold"] }
"ui.window" = { fg = "linenr" }
"ui.virtual.whitespace" = { fg = "indent" }
"ui.virtual.indent-guide" = { fg = "indent" }
"ui.virtual.ruler" = { bg = "cursorline" }
"ui.virtual.inlay-hint" = { fg = "inlay", modifiers = ["italic"] }
"ui.virtual.jump-label" = { fg = "cursor", modifiers = ["bold"] }

"diff.plus" = { fg = "added" }
"diff.delta" = { fg = "modified" }
"diff.minus" = { fg = "removed" }

"error" = { fg = "error", modifiers = ["bold"] }
"warning" = { fg = "warning", modifiers = ["bold"] }
"info" = { fg = "info", modifiers = ["bold"] }
"hint" = { fg = "hint", modifiers = ["bold"] }
"diagnostic.error" = { underline = { color = "error", style = "curl" } }
"diagnostic.warning" = { underline = { color = "warning", style = "dashed" } }
"diagnostic.info" = { underline = { color = "info", style = "dotted" } }
"diagnostic.hint" = { underline = { color = "hint", style = "dotted" } }
"diagnostic.unnecessary" = { modifiers = ["dim"] }
"diagnostic.deprecated" = { modifiers = ["crossed_out"] }

[palette]
bg = "#111214"
bg-alt = "#1A1B21"
cursorline = "#18171D"
selection = "#383B4A"
focus-bg = "#464957"
linenr = "#3B3D4A"
linenr-active = "#9799AA"
cursor = "#CDCFD1"
indent = "#1F1F26"
status-fg = "#9799AA"
mode = "#779BB0"
inlay = "#505261"
error = "#FFABA2"
warning = "#C18E5F"
info = "#9EB6C3"
hint = "#7E7F95"
added = "#5F7986"
removed = "#90655D"
modified = "#5B6370"
text = "#BBBCC7"
variable = "#BBBCC7"
parameter = "#BAB6CB"
property = "#A3A6B5"
keyword = "#779BB0"
function = "#D8D0D0"
type = "#B7C8CB"
builtin = "#91A5AA"
selfvar = "#AD97A9"
constant = "#ECD8AE"
string = "#D9CBAE"
escape = "#ECD8AE"
comment = "#696D7D"
doc = "#898D9E"
macro = "#B7C8CB"
attribute = "#7E7E94"
lifetime = "#BDB2B9"
namespace = "#9194A4"
operator = "#8D8FA0"
punct = "#5E6170"
md-heading = "#D7D2E6"
md-hmark = "#7F879E"
md-bold = "#E3D9D9"
md-italic = "#BBBCC7"
md-code = "#D9CBAE"
md-link = "#B6CCD3"
md-url = "#5E6170"
md-list = "#779BB0"
md-quote = "#898D9E"
md-fence = "#5E6170"
md-rule = "#2C2F39"
