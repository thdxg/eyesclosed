<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eyesclosed — a low-chroma dark theme</title>
<meta name="description" content="A low-chroma dark theme for terminals and editors.">
<meta name="theme-color" content="#111214">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="bundle.css">
<link rel="stylesheet" href="site.css">
<script src="site.js" defer></script>

<body class="ec">
<aside class="scroll-panel" aria-hidden="true"><div class="scroll-track"><span></span><span class="flip"></span><span></span><span class="flip"></span></div></aside>
<div class="ec-page">
<main>

<section class="ec-hero">
  <div class="ec-reveal">
    <h1>eyesclosed is a <span class="ec-quiet">low-chroma</span> dark theme for terminals and editors.</h1>
    <div class="ec-hero-actions"><a class="ec-btn ec-btn--primary" href="https://github.com/thdxg/eyesclosed/blob/main/themes/README.md">Get the theme ↗</a><a class="ec-btn" href="https://github.com/thdxg/eyesclosed">GitHub ↗</a></div>
  </div>
  <img class="hero-photo" src="moonrise.webp" srcset="moonrise-1000.webp 1000w, moonrise.webp 1877w" sizes="calc(100vw - 48px)" width="1877" height="2286" loading="lazy" alt="">
</section>

<section class="palette" id="palette" aria-label="Palette">
  <span class="formats" role="group" aria-label="Color format" data-formats hidden><button type="button" data-format="hex" aria-pressed="true">Hex</button><button type="button" data-format="rgb" aria-pressed="false">RGB</button><button type="button" data-format="hsl" aria-pressed="false">HSL</button></span>
  <ul class="chips">
  <li><button class="chip copy-value" type="button" data-hex="#111214" data-rgb="rgb(17, 18, 20)" data-hsl="hsl(220, 8%, 7%)" aria-label="Copy night #111214"><span class="swatch" style="--c:#111214"></span><span class="chip-name">night</span><span class="chip-value"><span class="v">#111214</span></span></button></li>
  <li><button class="chip copy-value" type="button" data-hex="#1A1B21" data-rgb="rgb(26, 27, 33)" data-hsl="hsl(231, 12%, 12%)" aria-label="Copy lid #1A1B21"><span class="swatch" style="--c:#1A1B21"></span><span class="chip-name">lid</span><span class="chip-value"><span class="v">#1A1B21</span></span></button></li>
  <li><button class="chip copy-value" type="button" data-hex="#383B4A" data-rgb="rgb(56, 59, 74)" data-hsl="hsl(230, 14%, 25%)" aria-label="Copy shade #383B4A"><span class="swatch" style="--c:#383B4A"></span><span class="chip-name">shade</span><span class="chip-value"><span class="v">#383B4A</span></span></button></li>
  <li><button class="chip copy-value" type="button" data-hex="#464957" data-rgb="rgb(70, 73, 87)" data-hsl="hsl(229, 11%, 31%)" aria-label="Copy glow #464957"><span class="swatch" style="--c:#464957"></span><span class="chip-name">glow</span><span class="chip-value"><span class="v">#464957</span></span></button></li>
  <li><button class="chip copy-value" type="button" data-hex="#696D7D" data-rgb="rgb(105, 109, 125)" data-hsl="hsl(228, 9%, 45%)" aria-label="Copy haze #696D7D"><span class="swatch" style="--c:#696D7D"></span><span class="chip-name">haze</span><span class="chip-value"><span class="v">#696D7D</span></span></button></li>
  <li><button class="chip copy-value" type="button" data-hex="#9A9DAE" data-rgb="rgb(154, 157, 174)" data-hsl="hsl(231, 11%, 64%)" aria-label="Copy ash #9A9DAE"><span class="swatch" style="--c:#9A9DAE"></span><span class="chip-name">ash</span><span class="chip-value"><span class="v">#9A9DAE</span></span></button></li>
  <li><button class="chip copy-value" type="button" data-hex="#BBBCC7" data-rgb="rgb(187, 188, 199)" data-hsl="hsl(235, 10%, 76%)" aria-label="Copy mist #BBBCC7"><span class="swatch" style="--c:#BBBCC7"></span><span class="chip-name">mist</span><span class="chip-value"><span class="v">#BBBCC7</span></span></button></li>

  <li><button class="chip copy-value" type="button" data-hex="#D9CBAE" data-rgb="rgb(217, 203, 174)" data-hsl="hsl(40, 36%, 77%)" aria-label="Copy linen #D9CBAE"><span class="swatch" style="--c:#D9CBAE"></span><span class="chip-name">linen</span><span class="chip-value"><span class="v">#D9CBAE</span></span></button></li>

  <li><button class="chip copy-value" type="button" data-hex="#C18E5F" data-rgb="rgb(193, 142, 95)" data-hsl="hsl(29, 44%, 56%)" aria-label="Copy ember #C18E5F"><span class="swatch" style="--c:#C18E5F"></span><span class="chip-name">ember</span><span class="chip-value"><span class="v">#C18E5F</span></span></button></li>
  <li><button class="chip copy-value" type="button" data-hex="#FFABA2" data-rgb="rgb(255, 171, 162)" data-hsl="hsl(6, 100%, 82%)" aria-label="Copy flare #FFABA2"><span class="swatch" style="--c:#FFABA2"></span><span class="chip-name">flare</span><span class="chip-value"><span class="v">#FFABA2</span></span></button></li>
  </ul>
</section>
