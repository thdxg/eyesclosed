# eyesclosed: a minimal low-chroma theme

gui:
  theme:
    activeBorderColor:
      - "#779BB0" # tide
      - bold
    inactiveBorderColor:
      - "#383B4A" # shade
    searchingActiveBorderColor:
      - "#ECD8AE" # candle
      - bold
    optionsTextColor:
      - "#9A9DAE" # ash
    selectedLineBgColor:
      - "#383B4A" # shade
    inactiveViewSelectedLineBgColor:
      - "#1A1B21" # lid
    cherryPickedCommitFgColor:
      - "#ECD8AE" # candle
    cherryPickedCommitBgColor:
      - "#464957" # glow
    markedBaseCommitFgColor:
      - "#CDCFD1" # moon
    markedBaseCommitBgColor:
      - "#464957" # glow
    unstagedChangesColor:
      - "#C18E5F" # ember
    defaultFgColor:
      - "#BBBCC7" # mist
  authorColors:
    "*": "#9A9DAE" # ash
git:
  pagers:
    - colorArg: always
      pager: delta --dark --paging=never
