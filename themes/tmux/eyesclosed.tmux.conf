# eyesclosed: a minimal low-chroma theme

set -g status-style "bg=#1A1B21,fg=#9A9DAE"
set -g status-left "#[fg=#111214,bg=#779BB0,bold] #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=#696D7D]%H:%M "
set -g window-status-format " #I #W "
set -g window-status-style "fg=#696D7D,bg=#1A1B21"
set -g window-status-current-format " #I #W "
set -g window-status-current-style "fg=#CDCFD1,bg=#1A1B21,bold"
set -g window-status-activity-style "fg=#ECD8AE,bg=#1A1B21"
set -g window-status-bell-style "fg=#FFABA2,bg=#1A1B21,bold"
set -g window-status-separator ""

set -g pane-border-style "fg=#383B4A"
set -g pane-active-border-style "fg=#779BB0"
set -g display-panes-colour "#383B4A"
set -g display-panes-active-colour "#779BB0"

set -g message-style "fg=#BBBCC7,bg=#1A1B21"
set -g message-command-style "fg=#BBBCC7,bg=#1A1B21"
set -g mode-style "fg=#CDCFD1,bg=#383B4A"
set -g copy-mode-match-style "fg=#BBBCC7,bg=#464957"
set -g copy-mode-current-match-style "fg=#111214,bg=#ECD8AE"
set -g clock-mode-colour "#779BB0"
