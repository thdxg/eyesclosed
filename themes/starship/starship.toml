# eyesclosed: a low-chroma dark theme

"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
command_timeout = 5000

format = """
$directory\
$git_branch\
$git_state\
$git_status\
$mise\
$line_break\
$shell\
$character"""

[directory]
style = "#CDCFD1"
[shell]
disabled = false
style = "#696D7D"
format = "[$indicator]($style)"
nu_indicator = ""
zsh_indicator = "zsh "
bash_indicator = "bash "

[character]
success_symbol = "[❯](#779BB0)"
error_symbol = "[❯](#FFABA2)"
vimcmd_symbol = "[❮](#B7C8CB)"

[git_branch]
format = "[$branch]($style)"
style = "#9A9DAE"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)]($style)($ahead_behind$stashed)]($style) "
style = "#779BB0"
conflicted = "‎ "
untracked = "‎ "
modified = "‎ "
staged = "‎ "
renamed = "‎ "
deleted = "‎ "
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "#9A9DAE"

[mise]
format = "[$symbol $health]($style) "
disabled = false
symbol = "mise"
healthy_symbol = "✔︎"
unhealthy_symbol = "✘"
style = "#696D7D"
